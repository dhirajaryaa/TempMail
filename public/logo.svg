<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="96" fill="#ff5a54"/>
  <g transform="translate(256, 240)">
    <!-- Envelope body -->
    <rect x="-150" y="-60" width="300" height="180" rx="20" fill="white" opacity="0.95"/>
    <!-- Envelope flap (V shape) -->
    <path d="M-150 -60 L0 70 L150 -60" fill="none" stroke="white" stroke-width="24" stroke-linejoin="round" opacity="0.95"/>
    <path d="M-150 -60 L0 70 L150 -60 L150 -60 L-150 -60Z" fill="#ff5a54"/>
    <path d="M-150 -60 L0 70 L150 -60" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round" opacity="0.3"/>
    <!-- Clock circle (top-right) -->
    <circle cx="100" cy="-90" r="55" fill="white" opacity="0.95"/>
    <circle cx="100" cy="-90" r="45" fill="#ff5a54"/>
    <!-- Clock hands -->
    <line x1="100" y1="-90" x2="100" y2="-115" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="-90" x2="118" y2="-82" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <!-- Clock center dot -->
    <circle cx="100" cy="-90" r="4" fill="white"/>
  </g>
</svg>
